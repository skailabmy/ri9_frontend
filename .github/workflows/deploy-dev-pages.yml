# Deploys the DEV build (staging API, debug logging) to GitHub Pages.
# Triggered on every push to the `capacitor/migration` branch.
#
# One-time repo setup (Settings → Pages → Build and deployment):
#   Source: "GitHub Actions"
#
# Live URL after first successful run:
#   https://skailabmy.github.io/ri9_frontend/

name: Deploy dev to GitHub Pages

on:
  push:
    branches: [capacitor/migration]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # --mode development loads .env.development (staging API base URL, debug logging)
      - name: Build (development mode)
        run: npm run build -- --mode development

      - name: Setup Pages (enable/switch source to GitHub Actions)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages-dev
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
