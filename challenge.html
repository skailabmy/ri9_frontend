<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Daily Challenge</title>
<meta name="theme-color" content="#eaf7d4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
<link rel="stylesheet" href="/src/pages/challenge/challenge.css">
<script type="module" src="/src/pages/challenge/challenge.ts"></script>
</head>
<body>
<!-- backdrop outside the scaled stage — covers the FULL screen (incl. iOS
     notch / home-indicator areas); content inside .viewport is inset by
     the safe areas. Light arena theme, same as the stats page. -->
<div class="arena-bg" aria-hidden="true"><i class="sun"></i><i class="lines"></i><canvas class="emb"></canvas><i class="vign"></i></div>

<div class="viewport" id="vp">
<main class="stage" id="stage">

  <!-- ===== CHALLENGE LOBBY — ported from the prototype
       (#s-lobby, references/index.html — the final .lbx stage-pass
       design: prize podium + chase strip + setup bar) ===== -->
  <section class="screen play" id="s-lobby" aria-label="Daily challenge">
    <div class="ahdr in2" style="--a:up .5s ease">
      <button class="gbtn" id="lbBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h2>DAILY <span>CHALLENGE</span></h2><span class="live"><i></i>LIVE · RESETS <b id="resetT">--:--:--</b></span></div>
      <button class="gbtn pwb" id="lbPast" aria-label="Past winners"><svg viewBox="0 0 24 24"><path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4c0 2.6 1.3 3.9 3.1 4.4M17 6h3c0 2.6-1.3 3.9-3.1 4.4M12 13v3"/><circle cx="17.5" cy="17.5" r="4.5" fill="#fff"/><path d="M17.5 15.5v2.2l1.4 1"/><path d="M8 20h4.5"/></svg></button>
      <button class="gbtn" id="lbInfo" aria-label="How ranking works"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v5.5M12 7.6v.2"/></svg></button>
    </div>

    <div class="aseg in2" style="--d:.05s" id="seg"><span class="k" id="segK"></span><button class="on" data-p="today">TODAY</button><button data-p="week">THIS WEEK</button></div>

    <div class="lbx in2" style="--a:up .55s cubic-bezier(.2,1.2,.4,1);--d:.1s">
      <div class="lcap"><svg viewBox="0 0 24 24"><path d="M4 11h16v10H4zM2 7h20v4H2zM12 7v14"/><path d="M12 7C10 3 6 3 6 5.5S9 7 12 7c3 0 6-.5 6-1.5S14 3 12 7z"/></svg><span><b>TOP 10 WIN PRIZES</b> · tap a prize to choose yours</span></div>
      <div class="lstage"><div class="lpod" id="lpod" aria-label="Top 3 and their prizes"></div><button class="lbase" id="lbase" aria-label="Prize for 4th to 10th place"></button></div>
      <div class="alist in2" id="alist" aria-label="Ranks 4 to 10" style="--a:fade .5s ease;--d:.2s"></div>
      <div class="you4 in2" id="you4" aria-label="Your rank" style="--a:up .55s cubic-bezier(.2,1.3,.4,1);--d:.45s"></div>
      <div class="chase" id="chase"></div>
    </div>

    <div class="lbar in2" id="lbar" style="--a:up .6s cubic-bezier(.2,1.3,.4,1);--d:.2s">
      <div class="lbar-f">
        <button class="lrow" id="fSubj" aria-label="Change subject"><span class="li" id="fSubjI"></span><span class="lv"><small id="fSubjL">YEAR 4 · SUBJECT</small><b id="fSubjV">Mathematics</b></span><span class="chg"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>
        <button class="lrow" id="fCh" aria-label="Change chapter"><span class="li"><b id="fChN">1</b></span><span class="lv"><small id="fChL">CHAPTER 1 OF 8</small><b id="fChV">Whole Numbers</b></span><span class="chg"><svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg></span></button>
      </div>
      <button class="lgo" id="toDrill" aria-label="Start challenge"><span class="lping"></span><svg class="lring" viewBox="0 0 114 114"><circle cx="57" cy="57" r="55"/></svg><span class="lgi"><b>GO</b><span class="chev"><svg viewBox="0 0 12 24"><path d="M3 4l7 8-7 8"/></svg><svg viewBox="0 0 12 24"><path d="M3 4l7 8-7 8"/></svg><svg viewBox="0 0 12 24"><path d="M3 4l7 8-7 8"/></svg></span></span></button>
    </div>
  </section>

  <!-- ===== PAST WINNERS (ported from the prototype #s-past) ===== -->
  <section class="screen off" id="s-past" aria-label="Past winners">
    <div class="ahdr in2" style="--a:up .5s ease">
      <button class="gbtn" id="pwBack" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="tt"><h2>PAST <span>WINNERS</span></h2></div>
      <span style="width:42px;flex:none"></span>
    </div>
    <div class="aseg pwseg in2" id="pwSeg" style="--d:.04s"><span class="k" id="pwK"></span><button class="on" data-t="quiz">PRIZE QUIZ</button><button data-t="lb">LEADERBOARDS</button></div>
    <div class="pw-sum in2" id="pwSum" style="--d:.08s"></div>
    <div class="pw-chips in2" id="pwF" style="--d:.1s"></div>
    <div class="pw-list scroll" id="pwList"></div>
  </section>

  <!-- ===== PICKER SHEET (subject / chapter / prize + academic year rail) ===== -->
  <div class="pkbd" id="pkBd"></div>
  <div class="pk" id="pk" role="dialog" aria-modal="true" aria-labelledby="pkT">
    <div class="yrail" id="yrail"><span class="yic"><svg viewBox="0 0 24 24"><path d="M3 9l9-5 9 5-9 5z"/><path d="M7 11.5V16c0 1.4 2.2 2.5 5 2.5s5-1.1 5-2.5v-4.5M21 9v5"/></svg></span><span class="ytx"><small id="ycurS">ACADEMIC YEAR</small><b id="ycur">KSSR Year 4</b></span><button class="ychg" id="ychg" aria-haspopup="listbox">Change<svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button></div>
    <div class="ydd" id="ydd" role="listbox" aria-label="Academic year"></div>
    <div class="pkh"><small id="pkS">STEP 1 · SUBJECT</small><h3 id="pkT">PICK A SUBJECT</h3><button class="pkx" id="pkX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="pk-o" id="pkO"></div>
  </div>

  <!-- ===== PRIZE PICKER DIALOG (ported from the prototype #pzd) ===== -->
  <div class="pzbd" id="pzBd"></div>
  <div class="pzd" id="pzd" role="dialog" aria-modal="true" aria-labelledby="pzT">
    <div class="ph"><small id="pzS"><i>1</i>1ST PLACE</small><h4 id="pzT">PICK YOUR PRIZE</h4><p id="pzP">Finish 1st and this one is yours.</p>
      <button class="px" id="pzX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="pg" id="pzG"></div>
  </div>

  <!-- ===== PAST WINNERS DETAIL SHEET ===== -->
  <div class="pwd-bd" id="pwdBd"></div>
  <div class="pwd" id="pwd" role="dialog" aria-modal="true" aria-labelledby="pwdT">
    <div class="pwd-h"><small id="pwdS"></small><h4 id="pwdT"></h4><p id="pwdP"></p><button class="pwd-x" id="pwdX" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><div class="pwd-you" id="pwdYou"></div></div>
    <div class="pwd-b" id="pwdB"></div>
    <div class="pwd-f" id="pwdF"></div>
  </div>

  <div class="toast" id="toast" role="status"></div>
</main>
</div>
</body>
</html>
