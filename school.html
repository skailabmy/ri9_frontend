<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>School Portal</title>
<meta name="theme-color" content="#eaf7d4">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Jost:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&display=swap">
<style>
/* School portal: same brand as the kid app (lime + charcoal, Anton + Jost, forward-leaning cards), laid out for desktop and phone. */
:root{
  --ground:#eef6e2;--ground-2:#f8fbf3;--card:#fff;--char:#1e1f1c;--char-2:#2c2e29;
  --lime:#c6f432;--lime-2:#a7d81c;--lime-soft:#eaf7c6;--ink:#1b1c19;--muted:#5d6650;--muted-2:#8a9478;--line:#e6ebdb;--red:#ff4d3a;
  --f-display:"Anton","Oswald","Impact","Arial Narrow",sans-serif;
  --f-ui:"Jost","Futura","Century Gothic","Avenir Next",system-ui,sans-serif;
  --lv-s:#8fc914;--lv-g:#4fb3f5;--lv-w:#ff6b5a;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--f-ui);color:var(--ink);-webkit-font-smoothing:antialiased;background:linear-gradient(180deg,#e7f5cf 0%,var(--ground) 30%,var(--ground-2) 100%) fixed;font-size:14px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,select,textarea{font:inherit;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:10px}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.bgfx i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.7}
.bgfx .b1{width:60vmax;height:60vmax;right:-25vmax;top:-30vmax;background:#d5f37a}
.bgfx .b2{width:50vmax;height:50vmax;left:-28vmax;bottom:-20vmax;background:#dff5a6;opacity:.5}
.bgfx .gr{position:absolute;inset:0;background-image:radial-gradient(#00000010 1px,transparent 1.2px);background-size:22px 22px;-webkit-mask-image:linear-gradient(180deg,#000,transparent 50%);mask-image:linear-gradient(180deg,#000,transparent 50%)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;padding:20px 14px;color:#fff;
  background:radial-gradient(140% 70% at 0% 100%,#3d5a0e 0%,#26301a 40%,var(--char) 75%);overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 16px}
.brand .lg{width:40px;height:40px;border-radius:14px 4px 14px 4px;background:var(--lime);display:grid;place-items:center;color:var(--ink);font-family:var(--f-display);font-size:18px;transform:skewX(-8deg);box-shadow:0 3px 0 #6f9a0b}
.brand b{display:block;font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:.4px;line-height:1;transform:skewX(-7deg)}
.brand small{display:block;font-size:10px;font-weight:700;letter-spacing:1.2px;color:#ffffff8c;margin-top:3px}
.nav-i{display:flex;align-items:center;gap:12px;height:46px;padding:0 12px;border-radius:16px 5px 16px 5px;color:#ffffffb3;font-weight:700;font-size:14px;text-decoration:none;transition:background .2s,color .2s}
.nav-i svg{width:21px;height:21px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav-i:hover{background:#ffffff0f;color:#fff}
.nav-i.on{background:var(--lime);color:var(--ink);box-shadow:0 3px 0 #6f9a0b}
.nav-i .ct{margin-left:auto;font-size:10.5px;font-weight:800;padding:2px 7px;border-radius:999px;background:#ffffff1f}
.nav-i.on .ct{background:#1b1c1926}
.nav-i .ad{margin-left:auto;font-size:8.5px;font-weight:800;letter-spacing:.8px;padding:2px 6px;border-radius:999px;background:#ff8a1e;color:#fff}
.side .sep{height:1px;background:#ffffff14;margin:10px 6px}
.side .drop{margin-top:auto;padding:12px;border-radius:20px 6px 20px 6px;background:#ffffff0d;border:1px solid #ffffff17;cursor:pointer}
.side .drop small{display:block;font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:var(--lime)}
.side .drop b{display:block;font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.5px;margin-top:4px;font-variant-numeric:tabular-nums}
.side .drop span{display:block;font-size:11px;color:#ffffff99;margin-top:2px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:14px 28px;background:#eef6e2d9;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #ffffff}
.top .mlogo{display:none}
.top h1{margin:0;font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;letter-spacing:.3px;transform:skewX(-8deg);transform-origin:0 50%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.top h1 span{background:var(--lime);padding:0 6px;box-shadow:3px 3px 0 var(--ink);display:inline-block;margin-left:2px}
.top .sp{flex:1}
.who{display:flex;align-items:center;gap:10px;height:46px;padding:0 12px 0 5px;border-radius:999px;background:#fff;box-shadow:0 6px 16px -10px #43601288;border:1px solid #fff;position:relative}
.who .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;background:var(--t,#e4f8a8)}
.who .nm{text-align:left;line-height:1.1}
.who .nm b{display:block;font-size:13px;font-weight:700;white-space:nowrap}
.who .nm small{display:block;font-size:10px;font-weight:800;letter-spacing:.8px;color:var(--muted)}
.who svg.ch{width:12px;height:12px;fill:none;stroke:var(--ink);stroke-width:2.8;stroke-linecap:round;stroke-linejoin:round}
.role{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.8px;padding:2px 7px;border-radius:999px;background:#ece9ff;color:#5b47d6}
.role.adm{background:#fff0d6;color:#a65d07}
.menu{position:absolute;right:0;top:calc(100% + 8px);z-index:30;width:290px;padding:8px;border-radius:22px 6px 22px 6px;background:#fff;box-shadow:0 24px 50px -14px #1b1c1955;border:1px solid #edf2e1;display:none}
.menu.open{display:block;animation:pop .25s cubic-bezier(.2,1.3,.4,1)}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}}
.menu h6{margin:6px 8px 6px;font-size:9.5px;font-weight:800;letter-spacing:1.4px;color:var(--muted-2)}
.menu button{width:100%;display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px 4px 14px 4px;text-align:left}
.menu button:hover{background:#f6f9ee}
.menu button.on{background:#f1fcd2}
.menu .av{width:32px;height:32px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;background:var(--t)}
.menu .tx{flex:1;min-width:0}.menu .tx b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.menu .tx small{font-size:10.5px;color:var(--muted)}
.content{width:100%;max-width:1200px;margin:0 auto;padding:22px 28px 60px}
.bnav{display:none}

/* ---------- building blocks ---------- */
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g-main{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
.card{position:relative;background:#fff;border-radius:28px 8px 28px 8px;padding:18px;box-shadow:0 5px 0 var(--ed,#dde7c6),0 20px 34px -26px #4a6d1299;min-width:0}
.card.dark{background:radial-gradient(120% 120% at 100% 100%,#3d5a0e 0%,#26301a 38%,var(--char) 70%);color:#fff;box-shadow:0 22px 40px -24px #1e2a08aa;overflow:hidden}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.ch h3{margin:0;font-size:15px;font-weight:700}
.ch small{font-size:11px;color:var(--muted);font-weight:600}
.ch .r{margin-left:auto;display:flex;gap:6px;align-items:center}
.lab{font-size:10.5px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.kpi{padding:14px 16px 13px}
.kpi small{display:block;font-size:10px;font-weight:800;letter-spacing:1.1px;color:var(--muted)}
.kpi b{display:block;margin-top:4px;font-family:var(--f-display);font-weight:400;font-size:32px;line-height:1;transform:skewX(-8deg);transform-origin:0 50%;font-variant-numeric:tabular-nums}
.kpi b em{font-style:normal;font-size:15px;color:var(--muted);margin-left:2px}
.kpi span{display:block;margin-top:5px;font-size:11px;font-weight:700;color:var(--muted-2)}
.kpi span.up{color:#3d8b06}.kpi span.dn{color:#c23a2f}
.kpi .ico{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:12px 4px 12px 4px;background:var(--kc,#e4f8a8);display:grid;place-items:center}
.kpi .ico svg{width:18px;height:18px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:42px;padding:0 16px;border-radius:14px 5px 14px 5px;font-size:13px;font-weight:800;letter-spacing:.3px;white-space:nowrap;transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(2px)}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.btn.pri{background:radial-gradient(circle at 35% 28%,#efff9e 0%,var(--lime) 45%,#98c814 100%);color:var(--ink);box-shadow:0 4px 0 #5f840a}
.btn.pri:active{box-shadow:0 1px 0 #5f840a}
.btn.dk{background:var(--ink);color:var(--lime);box-shadow:0 4px 0 #000}
.btn.gh{background:#fff;color:var(--ink);box-shadow:0 3px 0 #dfe8c9;border:1.5px solid #edf2e1}
.btn.sm{height:34px;padding:0 12px;font-size:12px}
.btn.dg{background:#ff6b5a;color:#fff;box-shadow:0 4px 0 #a3241a}
.seg{display:inline-flex;padding:4px;border-radius:13px;background:#ffffffc0;border:1px solid #fff;box-shadow:0 6px 16px -12px #4a6d1288;transform:skewX(-10deg)}
.seg button{position:relative;padding:7px 14px;border-radius:10px;font-size:11px;font-weight:800;letter-spacing:1.2px;color:#6b7360;transform:skewX(10deg);transition:background .25s,color .25s;white-space:nowrap}
.seg button.on{background:var(--ink);color:var(--lime)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 13px;border-radius:12px 4px 12px 4px;background:#fff;border:1.5px solid #edf2e1;font-size:12px;font-weight:700;color:#4e5644;transition:all .2s;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--lime)}
.chip i{font-style:normal;font-size:10px;font-weight:800;padding:1px 6px;border-radius:999px;background:#1b1c1912}
.chip.on i{background:#c6f43233}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:9px;font-weight:800;letter-spacing:.6px;padding:3px 8px;border-radius:999px;background:var(--pc,#f1f3ec);color:var(--pt,#5d6650);white-space:nowrap}
.lv-s{--pc:#e4f8a8;--pt:#3f6c05;--bc:var(--lv-s)}.lv-g{--pc:#dff1ff;--pt:#1f6fae;--bc:var(--lv-g)}.lv-w{--pc:#ffe4df;--pt:#c23a2f;--bc:var(--lv-w)}.lv-n{--pc:#f1f3ec;--pt:#8a9478;--bc:#d6dbcb}
.bar{height:8px;border-radius:5px;background:#eef1e6;overflow:hidden;transform:skewX(-20deg)}
.bar i{display:block;height:100%;width:var(--p);border-radius:5px;background:var(--bc,#8fc914);animation:fillw .9s cubic-bezier(.2,1,.3,1) both}
@keyframes fillw{from{width:0}}
.av{border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--t,#e4f8a8);color:var(--ink);flex:none}
.empty{padding:26px 16px;border-radius:24px 7px 24px 7px;border:1.5px dashed #b9cc95;background:#ffffff8c;text-align:center;color:var(--muted);font-size:13px;line-height:1.45}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:3px}
.pgh{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pgh .tt{flex:1;min-width:220px}
.pgh .tt small{display:block;font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--muted)}
.pgh .tt h2{margin:4px 0 0;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:1;transform:skewX(-8deg);transform-origin:0 100%}
.pgh .tt h2 span{color:#3f6c05}
.pgh .tt p{margin:6px 0 0;font-size:13px;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;margin-bottom:10px;font-size:12.5px;font-weight:800;color:#3f6c05}
.back svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.srch{display:flex;align-items:center;gap:8px;height:42px;padding:0 14px;border-radius:14px 5px 14px 5px;background:#fff;border:1.5px solid #edf2e1;min-width:220px}
.srch svg{width:16px;height:16px;flex:none;fill:none;stroke:var(--muted);stroke-width:2.4;stroke-linecap:round}
.srch input{flex:1;min-width:0;border:0;outline:none;background:none;font-size:14px}
/* rows (lists that read as tables on desktop) */
.rows{display:flex;flex-direction:column;gap:8px}
.rw{display:grid;align-items:center;gap:12px;padding:10px 12px;border-radius:18px 6px 18px 6px;background:#f8faf3;border:1.5px solid #eef2e4;text-align:left;width:100%;transition:background .15s,border-color .15s}
button.rw:hover,a.rw:hover{background:#f1fcd2;border-color:#d6ee8f}
.rw.hd{background:none;border:0;padding:0 12px 0;font-size:10px;font-weight:800;letter-spacing:1.1px;color:var(--muted-2)}
.rw .nm{display:flex;align-items:center;gap:10px;min-width:0}
.rw .nm .tx{min-width:0}
.rw .nm b{display:block;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .nm small{display:block;font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rw .num{font-family:var(--f-display);font-size:18px;font-variant-numeric:tabular-nums;transform:skewX(-8deg)}
.rw .num small{font-family:var(--f-ui);font-size:10px;color:var(--muted-2);font-weight:700;margin-left:2px}
.rw .acc{display:flex;align-items:center;gap:8px}
.rw .acc .bar{flex:1}
.rw .acc b{width:40px;text-align:right;font-family:var(--f-display);font-weight:400;font-size:16px;transform:skewX(-8deg)}
.rw .go{width:28px;height:28px;border-radius:50%;background:#fff;display:grid;place-items:center;justify-self:end;box-shadow:0 2px 0 #dfe8c9}
.rw .go svg{width:12px;height:12px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.cb{width:22px;height:22px;flex:none;border-radius:7px 2px 7px 2px;border:2px solid #c9d0bc;background:#fff;display:grid;place-items:center;transition:all .15s}
.cb svg{width:12px;height:12px;fill:none;stroke:var(--ink);stroke-width:3.4;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.cb.on{background:var(--lime);border-color:#8fc914}.cb.on svg{opacity:1}
.subj-ic{width:40px;height:40px;flex:none;border-radius:13px 4px 13px 4px;background:var(--sc,#e4f8a8);display:grid;place-items:center}
.subj-ic svg{width:22px;height:22px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.subj-ic svg .f{fill:var(--ink);stroke:none}
/* bars chart */
.wbars{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:6px}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;height:100%}
.wb .bx{flex:1;width:100%;display:flex;align-items:flex-end;position:relative}
.wb .bx i{display:block;width:100%;height:var(--h);border-radius:9px 3px 9px 3px;background:linear-gradient(180deg,#e2fd7a,#8fc914);transform:skewX(-8deg);transform-origin:bottom;animation:grow .7s cubic-bezier(.2,1.3,.4,1) both;animation-delay:var(--d)}
.wb .bx em{position:absolute;left:0;right:0;bottom:calc(var(--h) + 3px);text-align:center;font-style:normal;font-size:10px;font-weight:800;color:var(--muted)}
.wb.today .bx i{background:linear-gradient(180deg,#c6f432,#6f9a0b);box-shadow:0 0 14px #c6f43288}
.wb small{font-size:10.5px;font-weight:700;color:var(--muted-2)}
@keyframes grow{from{transform:skewX(-8deg) scaleY(0)}}
.ring{position:relative;width:96px;height:96px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;transform:skewX(-8deg)}
.ring .rv small{font-size:8.5px;font-weight:800;letter-spacing:1px;color:var(--muted)}
.card.dark .ring .rv small{color:#ffffff99}
/* subject cards */
.sjc{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%;cursor:pointer;transition:transform .12s}
.sjc:hover{transform:translateY(-2px)}
.sjc.on{box-shadow:0 5px 0 var(--sd),0 0 0 2.5px var(--sd)}
.sjc .t{display:flex;align-items:center;gap:10px}
.sjc .t b{font-size:14.5px;font-weight:700}
.sjc .t small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.sjc .v{display:flex;align-items:baseline;justify-content:space-between}
.sjc .v b{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1;transform:skewX(-8deg)}
.sjc .v span{font-size:11px;font-weight:700;color:var(--muted)}

/* ---------- prize drop / leaderboard ---------- */
.drop-b{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.drop-b .speed{position:absolute;inset:0;background:repeating-linear-gradient(105deg,transparent 0 22px,#c6f43209 22px 24px);animation:speed 1.2s linear infinite;pointer-events:none}
@keyframes speed{to{background-position:46px 0}}
.drop-b .glow{position:absolute;right:-60px;bottom:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(closest-side,#c6f43266,transparent);animation:pulse 2.6s ease-in-out infinite;pointer-events:none}
@keyframes pulse{50%{transform:scale(1.12);opacity:.7}}
.drop-b>*{position:relative}
.drop-b .tx{flex:1;min-width:200px}
.eyebrow{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--lime)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--red);animation:live 1.4s ease-out infinite}
@keyframes live{0%{box-shadow:0 0 0 0 #ff4d3a99}70%,100%{box-shadow:0 0 0 7px #ff4d3a00}}
.drop-b h3{margin:6px 0 0;font-family:var(--f-display);font-weight:400;font-size:34px;line-height:.95;transform:skewX(-7deg);transform-origin:0 100%}
.drop-b h3 span{color:var(--lime)}
.drop-b p{margin:6px 0 0;font-size:12.5px;color:#ffffffa6;max-width:420px}
.cd{display:flex;gap:6px;align-items:flex-start}
.cd .u{display:flex;flex-direction:column;align-items:center;gap:4px}
.cd .tile{min-width:58px;height:62px;padding:0 6px;border-radius:14px 5px 14px 5px;display:grid;place-items:center;background:linear-gradient(180deg,#363833,#262824);box-shadow:inset 0 1px 0 #ffffff1a,0 8px 12px -8px #000;font-family:var(--f-display);font-size:36px;color:#fff;font-variant-numeric:tabular-nums;transform:skewX(-6deg)}
.cd .tile.hot{color:var(--lime)}
.cd .u small{font-size:9px;font-weight:800;letter-spacing:1.5px;color:#ffffff80}
.cd .sep{font-family:var(--f-display);font-size:28px;line-height:62px;color:var(--lime);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:.25}}
.pod{display:grid;grid-template-columns:1fr 1.15fr 1fr;align-items:end;gap:10px;margin-top:6px}
.pod .p{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px}
.pod .p .av{width:56px;height:56px;font-size:15px;border-radius:18px 6px 18px 6px;transform:skewX(-6deg);box-shadow:0 4px 0 #0000001a}
.pod .p.me .av{box-shadow:0 0 0 3px var(--lime),0 0 18px #c6f43288}
.pod .p b{font-size:13px;font-weight:700;line-height:1.15}

  1:[['Choose the correct word: She ___ to school every day.','walks',['walk','walking','walked']],['What is the plural of "child"?','children',['childs','childes','childrens']],['Pick the noun: "The cat sleeps on the mat."','cat',['sleeps','on','the']],['Opposite of "ancient"','modern',['old','huge','quiet']],['They ___ playing football now.','are',['is','was','be']],['Which word is a verb?','jump',['blue','table','happy']],['"I have ___ apple."','an',['a','the','some']],['Past tense of "run"','ran',['runned','running','runs']],['Choose the adjective: "a bright red kite"','bright',['kite','a','red kite']],['Which sentence is correct?','He doesn\'t like durian.','He don\'t like durian.',],['Synonym of "big"','large',['tiny','thin','short']],['Fill in: "We went ___ the park."','to',['at','in','on']],['Which word needs a capital letter?','malaysia',['river','school','city']],['Choose the conjunction: "I was tired ___ I slept early."','so',['but','or','because of']]],
  2:[['Lawan "tinggi"','rendah',['besar','panjang','lebar']],['Kata nama: "Adik makan nasi."','nasi',['makan','adik makan','dengan']],['Imbuhan yang betul: ___tulis','menulis',['mentulis','mtulis','menjulis']],['Sinonim "gembira"','suka',['sedih','marah','takut']],['Jamak bagi "pokok"','pokok-pokok',['pokoks','pokokan','berpokok']],['"Ali pergi ___ sekolah."','ke',['di','dari','pada']],['Penjodoh bilangan: tiga ___ kereta','buah',['ekor','orang','biji']],['Kata kerja: "Mereka berlari laju."','berlari',['mereka','laju','berlari laju']],['Maksud "ringan tulang"','rajin',['malas','kuat','lemah']],['Ayat tanya yang betul','Siapakah nama awak?',['Nama awak siapa.','Awak nama siapa!','Siapa awak nama']],['Lawan "panas"','sejuk',['hangat','terik','basah']],['Kata sendi: "Buku itu ___ meja."','di atas',['ke atas','dari atas','pada atas']]],
  3:[['Plants make their own food by…','photosynthesis',['digestion','respiration','evaporation']],['Which animal is a mammal?','whale',['shark','frog','eagle']],['Water boils at…','100°C',['50°C','0°C','212°C']],['Which material conducts electricity?','copper',['wood','plastic','rubber']],['The closest star to Earth is…','the Sun',['Sirius','the Moon','Polaris']],['We breathe in ___ to live.','oxygen',['carbon dioxide','nitrogen','helium']],['Light travels in…','straight lines',['circles','zigzags','curves']],['Which part of a plant absorbs water?','root',['leaf','flower','fruit']],['A magnet attracts…','iron nails',['paper clips made of plastic','wood','glass']],['Which is a living thing?','mushroom',['rock','water','sand']],['Ice melting into water is a change of…','state',['colour','mass','smell']],['Shadows are formed when light is…','blocked',['reflected','heated','mixed']]]
};
function mathQ(chName,r){const ri=(a,b)=>a+Math.floor(r()*(b-a+1)),k=chName.toLowerCase();
  if(/fraction/.test(k)){const d=[4,6,8,10,12][ri(0,4)],a=ri(1,d-2),b=ri(1,d-1-a);return[`${a}/${d} + ${b}/${d} = ?`,`${a+b}/${d}`,[`${a+b}/${d*2}`,`${a+b+1}/${d}`,`${a*b}/${d}`]]}
  if(/decimal/.test(k)){const a=ri(11,89)/10,b=ri(11,89)/10,c=(a+b).toFixed(1);return[`${a} + ${b} = ?`,c,[(+c+.1).toFixed(1),(+c-1).toFixed(1),(+c+1).toFixed(1)]]}
  if(/percent/.test(k)){const p=[10,20,25,50,75][ri(0,4)],n=[40,80,120,200,360][ri(0,4)],c=n*p/100;return[`What is ${p}% of ${n}?`,c,[c+5,c-5,c*2]]}
  if(/money|saving/.test(k)){const a=ri(3,19),b=ri(2,9),c=ri(1,9),t=(a+b+c/10).toFixed(2);return[`RM${a}.00 + RM${b}.${c}0 = ?`,'RM'+t,['RM'+(+t+1).toFixed(2),'RM'+(+t-.5).toFixed(2),'RM'+(a+b).toFixed(2)]]}
  if(/time|duration/.test(k)){const h=ri(1,4),m=[15,30,45][ri(0,2)],c=h*60+m;return[`${h} h ${m} min = ? minutes`,c,[c+15,c-15,h*100+m]]}
  if(/measure|length|mass|volume/.test(k)){const m=ri(2,9),cm=ri(1,9)*10,c=m*100+cm;return[`${m} m ${cm} cm = ? cm`,c,[m*10+cm,c+100,c-10]]}
  if(/data|average|probab/.test(k)){const a=ri(10,30),b=ri(10,30),c0=ri(10,30),s=a+b+c0,c=c0+(3-s%3)%3,avg=(a+b+c)/3;return[`Find the average of ${a}, ${b} and ${c}.`,avg,[avg+1,avg-1,avg+3]]}
  if(/ratio|coordinat|space|shape|geometr/.test(k)){const a=ri(2,9),b=ri(2,9);return[`A rectangle is ${a} cm by ${b} cm. What is its perimeter?`,`${2*(a+b)} cm`,[`${a*b} cm`,`${a+b} cm`,`${2*(a+b)+2} cm`]]}
  const t=ri(0,2);if(t===0){const a=ri(120,899),b=ri(100,899);return[`${a} + ${b} = ?`,a+b,[a+b+10,a+b-10,a+b+100]]}
  if(t===1){const a=ri(500,999),b=ri(100,480);return[`${a} − ${b} = ?`,a-b,[a-b+10,a-b-10,a-b+100]]}
  const a=ri(12,49),b=ri(3,9);return[`${a} × ${b} = ?`,a*b,[a*b+b,a*b-b,a*(b+1)+1]]}
const qCache=new Map();
function bank(year,s,ch){const k=`${year}-${s}-${ch}`;if(qCache.has(k))return qCache.get(k);const r=rng(hash('bank'+k)),chName=chOf(year,s)[ch],out=[];
  for(let i=0;i<12;i++){let q,c,w;if(s===0)[q,c,w]=mathQ(chName,r);else{const B=BANKS[s];[q,c,w]=B[(i+Math.floor(r()*B.length))%B.length];}
    const d=i<4?'e':i<9?'m':'h';out.push({id:`q${s}-${ch}-${year===4?0:year}-${i}`,q,c:String(c),o:[String(c),...(Array.isArray(w)?w:[w]).map(String)].slice(0,4),d,topic:chName})}
  qCache.set(k,out);return out}

function teacherPts(tid){const ids=S.students.filter(s=>{const c=C(s.classId);return c&&c.teacher===tid}).map(s=>s.id);
  let q=0,ok=0;ids.forEach(id=>{const w=stuStats(id,'week');q+=w.q;ok+=w.ok});const hw=S.homework.filter(h=>h.by===tid).length;
  return Math.round(q*3.6+(q?ok/q:0)*800+hw*150)}
function board(){const mine=S.teachers.map(t=>({id:t.id,name:t.name,school:S.school,pts:teacherPts(t.id),mine:true}));
  const top=Math.max(...mine.map(m=>m.pts),1000),r=rng(4242);
  const others=OTHER.map(([n,s],i)=>({id:'o'+i,name:n,school:s,pts:Math.round(top*(i===0?1.12:i===1?.97:.94-i*.07+r()*.05))}));
  const all=[...mine,...others].sort((a,b)=>b.pts-a.pts);all.forEach((x,i)=>{x.rank=i+1;x.mv=Math.round((rng(hash(x.id))()-.5)*6)});return all}
function dropAt(){const n=new Date();return new Date(n.getFullYear(),n.getMonth()+1,0,23,59,59)}
function cdParts(){const s=Math.max(0,Math.floor((dropAt()-Date.now())/1000));return{d:Math.floor(s/86400),h:Math.floor(s%86400/3600),m:Math.floor(s%3600/60),s:s%60}}

    S.homework.push(h);save();toast(`Homework sent to ${n} student${n>1?'s':''} · +150 leaderboard pts`);HB.qids.clear();HB.note='';HB.studentIds=[];UI.hwTab='active';go('homework')}
};
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g){e.preventDefault();$('#menu')?.classList.remove('open');go(g.dataset.go);return}
  const b=e.target.closest('[data-act]');if(b&&ACTS[b.dataset.act]){if(b.tagName==='A'&&b.dataset.act.startsWith('hwFor')){ACTS[b.dataset.act](b);return}e.preventDefault();ACTS[b.dataset.act](b)}});
$('.side .drop').addEventListener('keydown',e=>{if(e.key==='Enter')go('ranks')});

/* ---------- live countdown ---------- */
function tick(){const p=cdParts();$$('.cdText').forEach(el=>el.textContent=`${p.d}d ${p2(p.h)}:${p2(p.m)}:${p2(p.s)}`);
  $$('[data-cd]').forEach(el=>{el.innerHTML=[[p.d,'DAYS'],[p2(p.h),'HRS'],[p2(p.m),'MIN'],[p2(p.s),'SEC']].map(([v,l],i)=>`${i?'<span class="sep">:</span>':''}<span class="u"><span class="tile${p.d===0&&i>0?' hot':''}">${v}</span><small>${l}</small></span>`).join('')});
  const mine=board().find(x=>x.id===S.me);$('#sideRank').textContent=`You're #${mine.rank} this month${mine.rank<=3?' · prize spot!':''}`}
setInterval(()=>{const p=cdParts();$$('.cdText').forEach(el=>el.textContent=`${p.d}d ${p2(p.h)}:${p2(p.m)}:${p2(p.s)}`);$$('[data-cd] .tile').forEach((t,i)=>{const v=[p.d,p2(p.h),p2(p.m),p2(p.s)][i];if(t.textContent!=String(v))t.textContent=v})},1000);
$('#schoolName').textContent=S.school.toUpperCase();
render();
})();
</script>
